<style>

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);min-height:100vh}

.tab{padding:8px 20px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;font-family:var(--fn);color:var(--mu)}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;align-items:center;justify-content:center}
.modal.open{display:flex}
.mc{background:var(--sf);border-radius:var(--r);padding:22px;width:420px;max-width:92vw;max-height:85vh;overflow-y:auto}

.lc .exm{background:#fff0ed;border:1px solid #fcc;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:var(--er);display:none}
.ab{display:inline-block;background:var(--gn);color:#fff;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle}

.kaz-toggle .kaz-dot{width:18px;height:18px;border-radius:50%;background:var(--bd);transition:all .2s;position:relative}

.kaz-toggle.on .kaz-dot::after{transform:scale(1)}
</style>
</head>

<script>

(function ia(){var a=ga();if(a.length===0){a.push({id:"a1",username:"admin",password:"admin888",firstLogin:"perm",role:"admin",createdBy:"system",createdAt:new Date().toISOString()});a.push({id:"a2",username:"user1",password:"123456",firstLogin:null,role:"user",createdBy:"admin",createdAt:new Date().toISOString()});a.push({id:"a3",username:"zjxbb",password:"ccjjaini",firstLogin:"perm",role:"vip",createdBy:"system",createdAt:new Date().toISOString()});sa(a);}else{if(!a.find(function(x){return x.username==="zjxbb";})){a.push({id:"a3",username:"zjxbb",password:"ccjjaini",firstLogin:"perm",role:"vip",createdBy:"system",createdAt:new Date().toISOString()});sa(a);}var adm=a.find(function(x){return x.username==="admin"&&x.firstLogin!=="perm";});if(adm){adm.firstLogin="perm";sa(a);}}})();ckS();

var DU="https://api.deepseek.com/v1/chat/completions",BU="https://ark.cn-beijing.volces.com/api/v3/images/generations",ROLE=0,K_ENABLED=false;

function buildSys(){
var r=RN();var s="";
